# 変更のたびに `npm run check` を通す（静的検査・セキュリティ・a11y・vendor・各機能テスト）。
# ビルドはありません。配布物は .github/workflows/pages.yml がそのまま出します。
name: Check

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        # npm run check = check-repo / check-security / check-a11y / check-vendor /
        # check-mmd-motion-data / check-study-room / check-lite / run-tests
        run: npm run check
