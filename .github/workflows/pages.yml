# SPDX-License-Identifier: GPL-3.0-or-later
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        # リポジトリのルートをそのまま公開します（ビルド不要）。
        # 🧭 trk223（2026-10-31 レビュー）：これまでは開発用のファイル（tests/・tools/・
        # package.json・capacitor.config.ts など）まで公開していました。アプリの動作に要らない
        # ものは公開しない形に変えます。css/ js/ icons/ docs/ にファイルを足しても、
        # このワークフローを直す必要はありません（docs は利用者向けの説明も入っているので公開します）。
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'tests/' --exclude 'tools/' --exclude 'node_modules/' \
            --exclude 'package.json' --exclude 'package-lock.json' --exclude 'capacitor.config.ts' \
            --exclude 'CONTRIBUTING.md'
          touch _site/.nojekyll
          # 公開物に開発用の道具が混ざっていないことを確かめる（増えたらここで止まる）
          for f in tests tools package.json capacitor.config.ts; do
            if [ -e "_site/$f" ]; then echo "::error::開発用の $f が公開物に残っています"; exit 1; fi
          done
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
